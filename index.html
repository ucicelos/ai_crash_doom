 framework.","broader_economy":"Narrow market concentrates wealth and risk in a handful of AI-capex-linked names while the real economy (small caps, rate-sensitive sectors) is already contracting under 5%+ long rates; ~40% of S&P 500 names are >20% below 52-week highs.","mechanism":"AI capex optimism supports tech multiples while AI-driven term premium lifts discount rates, crushing non-AI equities; when the AI-credit chain tightens, the narrow leadership has no broad-market cushion, accelerating multiple compression.","timing_read":"Supports the base-case orderly compression (45%: begins within 4–8 weeks, NQ-100 P/E 26.5x → 21–23x, index -15 to -25%) rather than a disorderly break — breadth already deteriorating beneath the surface.","severity":"context","observed_at":"2026-10-04T04:45:00-07:00","source_urls":"[\"https://www.wsj.com/finance/investing/ai-is-squeezing-out-the-rest-of-the-stock-market-60928dd3\"]","created_at":"2026-10-04T11:44:35.392Z"},{"fingerprint":"2026-10-04-hartnett-flow-show-dotcom-analogy-buy-bonds","title":"Hartnett (BofA Flow Show): current market virtually identical to pre-March-2000; buy humiliation in bonds","summary":"BofA chief strategist Michael Hartnetts latest Flow Show warns the market structure mirrors the six months before the March 2000 dot-com peak: tech up >40% while staples fell 30% and every other sector declined, virtually identical to now, with 400 S&P 500 constituents below their 50-day MA. On bonds he turns bullish (buy humiliation): 10y at ~5.3% (highest since 2002), ZROZ down 65% from 2020 peak, 10y rolling Treasury returns at -2% (century low). He flags hyperscaler IG bond yields (Oracle 8.4%, Meta 7.5%, Google 6.9%) nearing junk levels. He calls AI the biggest bubble since railways but warns both railway bubbles had falling yields, clearly not the case today, and says the three classic end-of-bubble signals (credit events, liquidity contraction, geopolitical capital outflows) are already visible in Oracle CDS, AUD/JPY, and French OATs.","why_important":"The most-followed institutional strategist is now explicitly mapping today to the 1999 template while the 10y sits at 5.3%, and is flipping bullish on beaten-down Treasuries - a widely-read contrary-positioning signal that could accelerate bond rotation.","broader_economy":"A sustained strategist-led rotation into duration would ease borrowing costs for households and firms if yields fall; but the AI-as-railway-bubble framing with rising yields points to capex financed at ever-higher rates, squeezing project returns economy-wide.","mechanism":"Higher yields raise discount rates and borrowing costs, compressing tech multiples; if institutional flows shift toward bonds (EPFR already shows record long-duration inflows), AI-credit demand faces a higher price of capital, which thins returns on the hyperscaler build-out and tightens the credit leg first.","timing_read":"Base case stands: orderly tech-multiple compression begins within 4-8 weeks and plays out over 3-6 months; Hartnetts explicit trigger levels (MOVE >125, IXG <$125, MDY <$666, IJR <$135) give concrete marks to watch. BofA Bull & Bear at 8.8 stays in sell territory.","severity":"watch","observed_at":"2026-10-04T04:10:00-07:00","source_urls":"[\"https://www.odaily.news/en/post/5213254\"]","created_at":"2026-10-04T11:04:03.077Z"},{"fingerprint":"2026-10-03-bessent-axios-yields-global-no-consternation","title":"Bessent (Axios, Sat): yield surge is global, didnt warrant consternation; Treasury open to more intervention","summary":"Treasury Secretary Scott Bessent told Axios (interview published Saturday Oct 3) the surge in Treasury yields is in line with global trends and did not warrant consternation: I would be concerned if we were having some kind of idiosyncratic rise. We are not seeing people selling treasuries to buy German bonds or Japanese bonds. He said I can not control the bond market. What I can do is get people to slow down and think, left the door open to further market interventions (touted the $20B Argentina swap line and the first coordinated yen-buying with Japan since 1998), and separately dismissed AI-bubble concerns, pointing to Microsoft/Google/Meta capex driving revenue growth at Anthropic and OpenAI.","why_important":"Treasury is explicitly not seeing disorderly or idiosyncratic US dysfunction in the bond selloff at 10y ~5.28-5.30% (24-yr highs); signals willingness to intervene (buybacks, swaps, FX) rather than let dysfunction fester.","broader_economy":"Frames the global bond rout as macro-shared (fiscal, oil, AI capex competition for capital) rather than a US credibility crisis; administration positioning for continued high-rate regime with intervention as backstop.","mechanism":"Verbal + toolkit intervention (Treasury buybacks, swap lines, FX coordination) damps bond-market dysfunction tail risk; but 10y anchor stays high, keeping the discount-rate pressure on tech multiples and the credit widening (HY OAS ~310-320bp, IG spread 6-mo high) intact.","timing_read":"Base case unchanged (45% orderly compression Nov 2026-Mar 2027; 30% disorderly; 25% extension). Marginally extension-supportive: trims near-term probability of a disorderly Treasury-market break leg (soft-auction bid-to-cover <2.3x trigger).","severity":"watch","observed_at":"2026-10-03T22:32:00-07:00","source_urls":"[\"https://en.infomaxai.com/news/articleView.html?idxno=141869\",\"https://10bmnews.com/bessent-downplays-worries-on-rising-yields-ai-bubble-concerns/\",\"https://www.briefs.co/news/treasury-chief-says-rising-u-s-yields-track-global-moves-urg/\"]","created_at":"2026-10-04T05:35:11.693Z"},{"fingerprint":"2026-10-03-anthropic-prospectus-42b-loss-518b-commitments","title":"Anthropic prospectus (Reuters): -$42B on $4.6B revenue, $518B of cloud/compute commitments","summary":"Reuters reviewed Anthropic's not-yet-public IPO prospectus: -$42B loss on $4.6B revenue last year (losses +425% y/y even as revenue grew 12x), $7.33B spent on compute/infra (3x y/y), and $518B of committed cloud/computing/infrastructure obligations in the coming years. The prospectus flags conflicts of interest around Broadcom's dual role as chip vendor and lender.","why_important":"Quantifies the off-balance-sheet funding load of one frontier lab — extreme capital intensity even with surging demand, squarely on the AI-credit channel of the thesis.","broader_economy":"$518B in commitments must be funded through equity and debt markets; if syndication appetite fades (see the Broadcom-Blackstone $60B test), funding shortfalls hit capex and the AI supply chain.","mechanism":"Vendor-financing circularity (Broadcom lending customers to buy its own chips) means chip demand is partly credit creation; when the credit spigot tightens, the demand signal reverses.","timing_read":"Direct AI-credit datapoint supporting the base-case view that the crash, if it comes, starts in credit rather than equity multiples.","severity":"context","observed_at":"2026-10-03T20:16:00+00:00","source_urls":"[\"https://stocktwits.com/news-articles/markets/equity/stocktwits-ai-roundup-micron-s-blowout-quarter-nvidia-s-150-b-buyback-and-the-race-for-ai-agents/cZDj2YGRB0x\"]","created_at":"2026-10-03T20:15:22.610Z"},{"fingerprint":"2026-10-03-boe-bailey-ai-valuation-warning","title":"BoE Bailey warns AI asset prices face sharper correction risk; FPC flags dot-com-era US valuations","summary":"BoE governor Andrew Bailey told the BBC AI asset prices could correct (Everybody is currently priced to be a winner... not everybody is a winner), citing Netscape. The BoE Financial Policy Committee (Sep 30) said AI valuations remain vulnerable to a sharper correction than July's, US equity valuations are close to their most stretched since the dot-com bubble, and AI-related debt issuance totalled ~$450B in 2026 YTD — double 2025 (Morgan Stanley estimate).","why_important":"A G7 central bank governor publicly naming AI valuations as a financial-stability risk institutionalizes the bear case on AI multiples.","broader_economy":"The FPC's own logic: when AI firms and lenders are entangled, a price correction becomes loan losses, tightening credit across the system.","mechanism":"$450B of debt-funded AI buildout means an equity correction propagates onto lenders' balance sheets, tightening credit, raising discount rates and compressing tech multiples.","timing_read":"Institutional-voice validation of the disorderly-break framing, not a trigger; base case (45% orderly compression, Nov 2026-Mar 2027) intact.","severity":"watch","observed_at":"2026-10-03T20:15:00+00:00","source_urls":"[\"https://www.reuters.com/business/finance/bank-england-sees-growing-risk-that-dangers-ai-debt-will-materialise-2026-09-30/\",\"https://startupfortune.com/bank-of-england-governor-warns-ai-valuations-could-face-a-sharper-correction/\"]","created_at":"2026-10-03T20:15:16.360Z"},{"fingerprint":"2026-10-04-jefferies-wood-greed-fear-yield-warning","title":"Jefferies Chris Wood (Greed & Fear): 10y 5.34% / 30y 5.69% — highest since 2002 — an important risk point for equities as Fed turns hawkish","summary":"Jefferies Global Equity Strategist Chris Wood warned in his Greed & Fear newsletter (Oct 3) that the latest Treasury selloff marks an important risk point for equities: the 10-year yield hit 5.34% and the 30-year touched 5.69%, both the highest since 2002, with the Fed adopting a more hawkish stance. Wood credits the highly earnings-accretive AI capex cycle for shielding equities so far, but names its durability and the returns on committed capital as the key questions; he also sees G7 government bonds in a structural bear market and notes US-yield spillover drove Indias 8th straight weekly equity decline.","why_important":"One of the most-read institutional strategist voices now explicitly framing 5.3%+ yields as a valuation breaking point; directly names the AI-capex earnings-accretion mechanism as the shield keeping equities resilient — the exact swing variable in the collapse-timing framework.","broader_economy":"Persistently elevated long yields tighten financial conditions globally, raising borrowing costs for households, companies and governments, and making equities less attractive relative to fixed income; Indias 8th weekly decline shows the spillover is already live in EM.","mechanism":"Higher long yields raise the discount rate on future earnings (compressing growth/tech multiples) and raise hurdle rates for debt-funded AI capex; if returns on committed AI capital do not materialize, the earnings-accretion shield fails and multiple compression follows.","timing_read":"Base case intact: orderly tech-multiple compression (45%) begins within 4-8 weeks; 10y ~20bp from the 5.5%-sustained flashing trigger; 2 of 12 signals flashing (tips-10y, erp-gap) — below the 3-signal escalation threshold.","severity":"watch","observed_at":"2026-10-03T17:30:00-07:00","source_urls":"[\"https://www.bizzbuzz.news/markets/stock-market/us-bond-yields-flash-warning-for-equities-as-ai-boom-faces-key-test-jefferies-1408537\"]","created_at":"2026-10-04T13:26:04.466Z"},{"fingerprint":"2026-10-03-corp-bond-wobble-paramount-debut","title":"Corporate bond demand wobbles: IG spread jumps most since March; Paramount debut bonds fall 4%","summary":"US corporate bonds wobbled this week as investors balked at a flood of new borrowing. The gap between corporate and Treasury yields jumped by the most since March, hitting a six-month high, amid record supply — Big Tech’s top four spenders sold ~80% more bonds in H1 2026 than in all of 2025. Paramount’s brand-new bonds issued for its $52B Warner Bros. buyout fell 4% on their first day of trading Thursday; the stock dropped over 9%.","why_important":"The first visible demand crack in the investment-grade primary market that has been funding the AI buildout. When debut bonds from a mega-LBO trade down 4% on day one and spreads gap wider, new-issue concessions rise for every AI-adjacent borrower, directly raising the financing cost of AI capex.","broader_economy":"Higher corporate borrowing costs crowd out weaker borrowers: smaller companies are down 8.5% from their August peak with a third struggling to cover interest bills, and credit is bifurcating as AI giants soak up lenders’ cash.","mechanism":"Record corporate supply + weaker primary demand → wider spreads and higher new-issue concessions → higher AI-capex financing costs → thinner project returns → harder to justify lofty tech multiples, squeezing the AI-credit channel that is the most likely crash origin (credit first, then multiples).","timing_read":"Orderly tech-multiple compression base case (45%) intact: begins within 4-8 weeks, plays out 3-6 months; NQ-100 forward P/E 26.5x→21-23x, index -15 to -25%. Disorderly (30%) still needs a discrete trigger (Brent >$130, soft auction bid-to-cover <2.3x, USD/JPY >160, or large AI-credit default). Extension (25%): 10y back under 4.75% + HY OAS <300bp sustained. 2 of 12 signals flashing (10y TIPS real yield, NQ-100 earnings-yield gap) — below the 3+ escalation bar.","severity":"watch","observed_at":"2026-10-03T16:45:00-07:00","source_urls":"[\"https://finimize.com/content/your-daily-brief-for-october-3rd-2026\"]","created_at":"2026-10-03T23:44:35.931Z"},{"fingerprint":"2026-10-04-ing-ai-yields-20pct-barrons","title":"ING research: AI accounts for ~20% of the rise in long-dated Treasury yields","summary":"ING analysts argue ~20% of the rise in longer-dated US Treasury rates — the 10-year Treasury yield rose from ~4.6% to above 5.3% in Q3, its fastest quarterly advance this century and a 24-year high — is attributable to AI, via three pillars: massive AI capex spending, AI-earmarked capital-market supply (junk-bond AI fundraising doubled to $36B this year per Citi, 24% of Q2 HY issuance vs 6% a year ago), and AI productivity effects.","why_important":"It is the first major-bank quantification of the AI->yields transmission channel: AI capex is not just funded through the bond market, it is itself lifting term premium — meaning AI-credit growth is self-limiting, with every new funding round pushing yields higher against tech multiples.","broader_economy":"Higher long-dated yields raise borrowing costs economy-wide (mortgages, corporate debt) and erode equity valuations; if AI spending is a material driver of the yield surge, the tech-led market structure transmits the stress back onto the AI trade itself.","mechanism":"AI capex -> record IG/HY issuance + term-premium lift -> 10y above 5.3% -> higher discount rates and borrowing costs -> tech multiple compression and more expensive AI capex financing -> project-return hurdle rises for datacenter builds.","timing_read":"Base case intact: orderly tech-multiple compression (45%) beginning Nov 2026-Mar 2027, Nasdaq-100 forward P/E 26.5x -> 21-23x, index -15 to -25%. Disorderly break (30%) still needs a discrete trigger (Brent >$130, soft Treasury auction with bid-to-cover <2.3x, USD/JPY through 160, or a large AI-credit default). Extension (25%): 10y back under 4.75% + HY OAS <300bp sustained.","severity":"watch","observed_at":"2026-10-03T15:00:00-07:00","source_urls":"[\"https://www.barrons.com/articles/ai-bond-yield-treasuries-stock-market-7e0e6d45\"]","created_at":"2026-10-04T10:34:23.563Z"},{"fingerprint":"2026-10-03-samsung-hbm4-3x-pricing","title":"Samsung seeks >3x pricing for HBM4 in 2027 contracts (~$4/Gb vs $1.50 HBM3E)","summary":"Samsung reportedly quoting mid-to-high $4 per gigabit for next-gen HBM4 in 2027 annual supply negotiations with major customers - more than 3x the ~$1.50/Gb of current flagship HBM3E (Korean daily MK via WSJ, Oct 2). Most 2027 volumes largely negotiated; price talks entering final stage this month. TrendForce forecasts HBM ASP up 121% in 2027. European chip stocks rallied: ASML +2.2%, ASM International +4.7%, Infineon +6%, STMicroelectronics +3.3%.","why_important":"Hard pricing-power datapoint for AI memory: contracted 3x pricing alongside Micron $32B LTAs and Korea +83.5% AI exports shows AI memory demand remains structurally tight, not just spot froth.","broader_economy":"Memory pricing power feeds AI-capex durability for the supply chain (semis, equipment, power). At the margin it also feeds the AI-demand-shock inflation channel Williams flagged: scarce AI inputs command inflationary premiums.","mechanism":"Contracted HBM4 pricing locks in memory-revenue visibility through 2027, supporting semi earnings -> sustained capex -> continued AI-infrastructure credit demand. Extension-supportive leg of the thesis; does not move the 10y ~5.28-5.30% discount-rate anchor that drives multiple compression.","timing_read":"Extension-supportive (undercuts peak-memory/capex-stall leg); does not change the orderly-compression base case window (begins within 4-8 weeks of Sept 27 research).","severity":"watch","observed_at":"2026-10-03T09:00:00+00:00","source_urls":"[\"https://www.wsj.com/business/tech-media-telecom-roundup-market-talk-7bcf02cb\",\"https://www.sammyfans.com/2026/10/01/samsung-hbm-prices-could-rise-over-100-next-year/\"]","created_at":"2026-10-03T08:54:15.348Z"},{"fingerprint":"2026-10-04-synopsys-investor-day-aws-openai-deals","title":"Synopsys Investor Day: above-consensus FY27 guide, $1B+ AWS custom-silicon deal, OpenAI partnership","summary":"Synopsys (SNPS) held its Investor Day Oct 1: guided FY2027 revenue of ~$11.15B (+15%) and adjusted EPS ~$19.08, both above consensus; signed a multiyear AWS agreement worth >$1B to license chip-design IP (plus royalties); and announced a multiyear OpenAI partnership to build GPT-Synopsys, an AI model for semiconductor engineering. Deutsche Bank raised its target to $640, BofA to $600, KeyBanc to $605, Rosenblatt to $620; Synopsys also announced a $1B buyback. Stock jumped ~13%.","why_important":"Fresh verified evidence that AI infrastructure spending is broadening beyond GPUs: a >$1B custom-silicon IP deal with AWS plus an OpenAI design-automation partnership shows hyperscalers and model labs are still committing real dollars to the AI compute build-out — a direct counter-datapoint to Friday's OpenAI-growth-slowdown scare.","broader_economy":"Sustains the AI-capex leg of growth that is keeping tech earnings (and indexes) afloat while the rest of the market draws down; if capex keeps being funded it supports semis, cloud, and power/data-center supply chains, but it also keeps bond-market pressure on since the AI boom is the rationale for the runaway-economy narrative pushing the 10y toward 5.3%.","mechanism":"Hyperscaler/lab capex commitments flow into chip-design and EDA revenue, validating AI demand durability across the supply chain and supporting semis and cloud capex multiples; however the deals also underline how much of the AI build-out rides on credit and corporate balance sheets rather than operating cash flow, keeping the credit-tightening channel (higher yields, wider spreads) as the main threat to the multiple.","timing_read":"Orderly tech-multiple compression (45%): begins within 4-8 weeks, plays out 3-6 months; Nasdaq-100 forward P/E 26.5x -> 21-23x, index -15 to -25%. Disorderly break (30%): needs a discrete trigger (Brent >$130, soft Treasury auction bid-to-cover <2.3x, USD/JPY through 160, or large AI-credit default); compression over 2-4 months, P/E ~18-20x, index -30 to -40%. Extension (25%): 10y back under 4.75% + HY OAS <300bp sustained. Signal check: 2 of 12 flashing (10y TIPS real yield 2.91% > 2.75%; ERP gap ~-140 to -150bp > 100bp); below the 3-signal escalation threshold.","severity":"watch","observed_at":"2026-10-02T20:00:00-07:00","source_urls":"[\"https://seekingalpha.com/news/4649017-synopsys-target-raised-by-50-at-deutsche-bank\",\"https://www.tipranks.com/news/synopsys-stock-surges-as-deutsche-bank-boosts-price-target-to-640-heres-why\"]","created_at":"2026-10-04T12:24:37.342Z"},{"fingerprint":"2026-10-03-doj-no-reopen-powell-probe-reported","title":"DOJ will not reopen criminal probe into former Fed Chair Powell","summary":"Attorney General Todd Blanche told Bloomberg on Friday (Reuters, Oct 2) the Justice Department is not reopening its criminal investigation into former Fed Chair Jerome Powell over the central bank's headquarters-renovation cost overruns. The move follows the Fed inspector general's Wednesday finding of no reasonable grounds for a criminal referral; a federal judge had quashed the January grand-jury subpoenas in March. President Trump attacked the decision and demanded Powell resign from the Board. Powell remains a Fed governor after stepping down as chair in May.","why_important":"Removes a political tail risk hanging over Fed independence ahead of the Oct 27-28 FOMC meeting, at a moment when markets are split between weak payrolls data and sticky long-end yields. Trump pressure on the Fed had been a bond-market risk premium factor.","broader_economy":"Fed independence risk premium eases slightly; the rate path stays data-driven rather than politics-driven, which matters for term premia on the 10y and 30y.","mechanism":"Reduced institutional risk lowers the uncertainty premium embedded in long-dated Treasuries; with the 30y at its highest since 2002, any removal of political risk supports orderly price discovery rather than forced repricing.","timing_read":"No change to base-case timing windows (orderly compression 45% starting within 4-8 weeks; disorderly break 30% needs a discrete trigger; extension 25% needs 10y under 4.75% + HY OAS under 300bp).","severity":"context","observed_at":"2026-10-02T17:00:00-04:00","source_urls":"[\"https://wncy.com/2026/10/02/blanche-says-doj-is-not-reopening-criminal-probe-into-feds-powell-bloomberg-news-reports/\"]","created_at":"2026-10-04T02:55:50.278Z"},{"fingerprint":"2026-10-02-barrons-amazon-spv-3t-footnote","title":"Barron's frames Amazon $8B SPV as part of $3T off-balance-sheet AI iceberg","summary":"Barron's (Oct 2) framed the FT-reported Amazon $8B Nvidia-chip SPV alongside the WSJ August analysis: nine top tech companies hold roughly $3T in AI-related commitments off their balance sheets — about 5x their combined trailing-12-month capex (~$600B). Burry's version: ~$1.2T uncommenced leases, ~$1.5T purchase commitments, ~$176B potentially concealed depreciation 2026-2028.","why_important":"The SPV protects Amazon's balance sheet and credit rating, but the cost returns as higher lease payments — leverage reprices, not disappears. Commitments buried in footnotes mean reported leverage understates true obligations ~5x.","broader_economy":"The accounting layer of the compression thesis. Debate has moved from whether hidden leverage exists to how fast it surfaces.","mechanism":"GAAP lets uncommenced leases/purchase agreements sit in footnotes -> reported debt ratios look cleaner -> multiples priced off cleaner ratios. If chip useful lives are overstated (Burry), impairment lands in 2028-2029 as write-downs — a cliff, not a slope.","timing_read":"Unchanged — base case orderly compression (45%), 2/12 flashing. Burry's 2028-2029 impairment window is beyond the compression window.","severity":"watch","observed_at":"2026-10-02T16:39:00-07:00","source_urls":"[\"https://www.barrons.com/articles/amazon-stock-price-ai-spending-spv-2dfa2c7d\",\"https://www.investopedia.com/market-update-amazon-looks-to-offload-8b-of-nvidia-ai-chips-from-its-balance-sheet-amzn-nvda-12154031\"]","created_at":"2026-10-02T23:41:48.541Z"},{"fingerprint":"2026-10-02-wsj-ai-squeezing-market-narrowness","title":"WSJ: AI squeezes the rest of the market - ~80% of S&P down in Sept, average stock -5%","summary":"WSJ analysis of September tape: while the Nasdaq-100 gained ~3% as the 10y jumped 4.7% to 5.3%, almost 80% of S&P 500 stocks fell, the average constituent dropped ~5%, only 2 of 11 sectors finished up (tech and comm services, the latter carried by META/GOOGL), and the Russell 2000 lost 5% vs +2% for the top 50 stocks. Capital is concentrating in AI/data-center-exposed names; the rest of the market faces higher rates and oil without an AI story. Atlanta Fed GDPNow has Q3 tracking ~3.7%.","why_important":"Hard numbers for market narrowness under a 24-year yield high: breadth is collapsing while headline AI multiples hold. This is the divergence phase that historically precedes broad multiple compression - confirmation that 5%+ yields are already biting everything except AI-touched names.","broader_economy":"A two-tier economy and market: AI capex supports semis/cloud/power chains, but higher-for-longer rates plus elevated oil tighten conditions for the rest - consumer cyclicals, small caps, and credit-sensitive sectors face margin and refinancing pressure.","mechanism":"Higher long yields raise discount rates and borrowing costs, which compresses multiples and slows capex - but AI beneficiaries are bid up anyway on capex-durability expectations, concentrating capital in fewer names. Narrow leadership is fragile: if the AI-credit leg wobbles, there is no breadth cushion underneath.","timing_read":"Supports the orderly-compression base case (45%): breadth collapse under 5%+ yields is the confirming input that multiple compression is already underway in non-AI stocks. Not a trigger yet.","severity":"watch","observed_at":"2026-10-02T16:30:00-04:00","source_urls":"[\"https://www.wsj.com/finance/investing/ai-is-squeezing-out-the-rest-of-the-stock-market-60928dd3\"]","created_at":"2026-10-03T00:17:04.137Z"},{"fingerprint":"2026-10-02-friday-close-recap-nasdaq-record","title":"Friday close: Nasdaq record 27,190.86; 10y settles ~5.28%, Oct hike odds collapse to ~23%","summary":"Confirmed Friday close: Nasdaq Composite 27,190.86 (+1.19%), a new closing record (intraday record too) and third straight weekly gain (+0.5% w/w). S&P 500 7,722.72 (+0.73%), Dow 51,176.96 (+0.49%) - but both lost ground for the week (-0.3% and -1.3%). VIX dropped to 15.40 (-6%). The 10y Treasury closed ~5.276-5.28%, up ~4bp on the day, fully erasing the post-NFP dip to 5.16%; 2y 4.823%, 30y 5.629%. CME FedWatch Oct-28 hike odds ~23%, down from 64% a week ago; December hike still priced near 90% (Reuters). NVDA closed at a new all-time high; chip names TER, MPWR, ARM each +5%+.","why_important":"Weak Sept NFP (29k vs 84k exp, unemployment 4.2%) killed October hike pricing, sparking a tech-led risk-on rally that pushed the Nasdaq to a record close - yet bonds rejected the relief entirely, with the 10y re-anchoring at a 24-year high. This equity-bonds divergence is the core tension of the compression thesis: AI equities bid up on rate-cut hopes while discount rates stay punitive.","broader_economy":"Record equity multiples alongside ~5.3% long rates mean financial conditions stay tight even as stocks celebrate a softer labor print. Mortgage/corporate borrowing costs remain elevated, which slows capex and consumer spending outside the AI trade.","mechanism":"The weak jobs report reduced the near-term Fed-hike premium (2y yield faded) but long-end yields re-rose on term-premium and fiscal-supply concerns: front-end relief does not pass through when bond investors demand compensation for deficit and inflation risk. Higher long yields raise discount rates, compressing equity multiples - which is why non-AI stocks kept falling while AI megacaps rallied.","timing_read":"Base case (45% orderly compression) unchanged: record NQ close at stretched multiples with the 10y pinned near 5.3% is the setup in which an oil or auction shock converts slow compression into the disorderly break (30%).","severity":"watch","observed_at":"2026-10-02T16:05:00-04:00","source_urls":"[\"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10022026-12153808\",\"https://www.wsj.com/finance/stocks/u-s-stocks-rise-as-jobs-report-tempers-rate-outlook-fde051d1\",\"https://www.reuters.com/business/fed-seen-skipping-october-rate-hike-job-market-cools-2026-10-02/\"]","created_at":"2026-10-03T00:16:48.561Z"},{"fingerprint":"2026-10-02-blue-owl-ocic-withdrawals-16-8","title":"Blue Owl OCIC Q3 withdrawal requests fell to 16.8% from 18.8%","summary":"Blue Owl's flagship $35.1B OCIC saw withdrawal requests fall to 16.8% in Q3 from 18.8%. Across two funds, $4.2B sought vs $4.7B prior. Both repurchasing only the customary 5% cap; most requests are resubmissions of unfulfilled tenders. Tech-focused OTIC still at $1.1B / 39% vs industry 10-17%. Blue Owl stock down ~45% in a year.","why_important":"Private-credit default rates are 2.51% (Q2) vs the 4% signal threshold — stress is showing up as redemption pressure, not defaults, yet. Easing is modestly bullish for extension, but the 5% cap and resubmission backlog mean the liquidity squeeze is deferred, not resolved.","broader_economy":"Redemption wave driven by lending-standard concerns and 'potential impact of AI on software companies' — a key borrower base for direct lenders. Links the private-credit signal directly to the SaaS AI-winner/loser thesis.","mechanism":"Floating-rate assets benefit from higher rates, so OCIC performs while investors still want out — a duration/liquidity mismatch, not a credit-loss story (yet). If AI software disruption impairs the borrower base: SaaS underperformance -> OTIC NAV pressure -> private-credit spread widening -> formal defaults signal fires. Watch OTIC's next tender as the leading edge.","timing_read":"Mildly hawkish for disorderly (cap backlog is a coiled spring), mildly dovish (direction of travel improved). Net: base case unchanged — orderly compression 45%, 2/12 flashing, no escalation.","severity":"watch","observed_at":"2026-10-02T16:02:00-07:00","source_urls":"[\"https://www.reuters.com/legal/transactional/blue-owl-flagship-fund-withdrawal-requests-slow-private-credit-turmoil-eases-2026-10-02/\"]","created_at":"2026-10-02T23:33:31.718Z"},{"fingerprint":"2026-10-02-brent-settle-102-25-weekly-4-94","title":"Brent $102.25 settle, +4.94% on week — biggest weekly gain since Sept 11","summary":"Front-month Brent settled at $102.25 (down 6 cents Friday), +4.94% on the week — largest weekly gain since Sept 11. Friday's intraday dip to ~$99.25 on G7 release headlines almost fully reversed. WTI closed at $91.11. YTD Brent is up 68%.","why_important":"The market treated a 100M-barrel coordinated release as a speed bump, not a cap — geopolitical risk premium is doing more pricing work than the physical release. The disorderly trigger ($120 sustained) is ~18% above Friday's close, not a distant scenario.","broader_economy":"Diesel pinch is refined-products driven; the IEA already did a record 400M-barrel release this year (~2/3 fulfilled) — diminishing returns on the one tool keeping the disorderly trigger at bay.","mechanism":"Brent >$120 sustained is a formal disorderly trigger: energy passes straight into CPI (eurozone already 3.8%) -> forces hawkish repricing -> real yields spike -> tech multiple compression accelerates from orderly to disorderly.","timing_read":"Unchanged base case (45%), 2/12 flashing. But Brent +5%, France 158bp, PCE revision are all accumulating on the compression side even on days equities hit records.","severity":"watch","observed_at":"2026-10-02T14:42:00-07:00","source_urls":"[\"https://www.morningstar.com/news/dow-jones/202610025482/front-month-ice-brent-crude-rose-494-this-week-to-settle-at-10225-data-talk\",\"https://www.wsj.com/business/energy-oil/oil-prices-fall-as-middle-east-crude-exports-recover-but-shipping-risks-remain-84ca187f\"]","created_at":"2026-10-02T23:33:31.718Z"},{"fingerprint":"2026-10-02-pce-methodology-3-6-3-7-old-basis","title":"August PCE's dovish read was partly statistical: old basis ~3.6-3.7%, not 3.4%","summary":"Marketplace (Oct 1): BLS changed how software and investment-services categories are calculated in August, shaving a couple tenths off the print. On the old methodology, headline inflation would have been ~3.6-3.7%, not the reported 3.4%. More than half the PCE basket still rising at 3%+.","why_important":"The disinflation narrative that drove the week's dovish repricing (Oct hike odds 64% -> ~23%) partly rested on a formula change, not actual price deceleration. It's why bonds looked straight through it.","broader_economy":"Underlying inflation still 3%+ on old basis; household real-income pressure persists; Fed higher-for-longer bias stays intact. All three economists surveyed expect pause this month and a hike in December.","mechanism":"Methodological disinflation lowers the measured price level without changing actual borrowing costs or inflation expectations — so real yields keep grinding higher while markets that priced 'cooling inflation' get re-rated. Feeds data-integrity skepticism, widening the term premium.","timing_read":"Hawkish at the margin. The dovish-PCE leg of the extension case is weaker than it looked Wednesday.","severity":"watch","observed_at":"2026-10-02T13:52:00-07:00","source_urls":"[\"https://www.marketplace.org/story/2026/10/01/pce-inflation-was-lower-than-expected-in-august\"]","created_at":"2026-10-02T23:33:31.717Z"},{"fingerprint":"2026-10-04-logan-50bp-more-hawkish","title":"Dallas Fed President Logan: fed funds target may need to rise an additional 50 bp or more","summary":"Dallas Fed President Lorie Logan said Friday she estimates the fed funds target range needs to rise an additional 50 bp or more to appropriately balance the outlook and risks for the Fed's dual mandate goals — hawkish Fedspeak delivered the same afternoon as the 29k September NFP miss. It explains why the 10y Treasury fully reversed its post-NFP dip (5.16% back to ~5.28% close) and why October-hold odds capped near ~80% instead of collapsing further.","why_important":"A sitting FOMC policymaker is explicitly still pricing in further hikes days before the Oct 27-28 meeting, undercutting the market's dovish NFP repricing. This is why the bond market's Friday relief didn't stick — and why the compression thesis stays live.","broader_economy":"Keeps the entire borrowing curve pinned high: 10y ~5.28%, mortgage rates ~7.47%, IG yields >6%. Households and corporates face persistently tight financial conditions even as hiring softens (unemployment 4.2%).","mechanism":"Hawkish Fedspeak re-anchors long yields; higher discount rates compress tech multiples (the orderly-compression engine) and keep AI-credit funding costs elevated, reinforcing the base-case compression path while pushing the extension scenario (10y back under 4.75%) further out of reach.","timing_read":"Base case stands: orderly tech-multiple compression (45%) begins within 4-8 weeks, Nasdaq-100 forward P/E 26.5x -> 21-23x, index -15 to -25%. Logan tempers the dovish tail; no escalation (10y not at 5.5% sustained, HY OAS <350bp).","severity":"watch","observed_at":"2026-10-02T13:00:00-07:00","source_urls":"[\"https://www.barchart.com/story/news/4936145/stocks-settle-higher-as-fed-rate-hike-concerns-ease\"]","created_at":"2026-10-04T22:35:04.391Z"},{"fingerprint":"2026-10-02-yield-relief-reversed-5-261","title":"Post-NFP yield relief fully reversed: 10y back to 5.26%, up 10.2bp on week","summary":"The 10y dipped to 5.178% right after the jobs print, then climbed back to 5.261% — up on the day and up 10.2bp on the week. The 2y ended at 4.816%, also up. One driver: eurozone inflation jumped to 3.8% in September (vs 3.6% expected), driven by fuel and gas.","why_important":"Long-end yields are being priced on inflation and supply, not the Fed's next hike. The day's pattern is instructive: bad data rallied equities and briefly cheapened bonds, then inflation/France repriced the long end up again.","broader_economy":"Global inflation repricing is overriding US labor softness — the 10y is anchored by term premium, fiscal supply, and energy, not the rate path.","mechanism":"Hot eurozone CPI -> global rate expectations repriced upward -> US long-end dragged higher despite soft NFP. The long end responds to inflation reality; only the front end responds to Fed odds.","timing_read":"Undercuts the extension case's premise. The market is discounting rate-path relief while bonds price fiscal/inflation reality — when those reconcile, they reconcile at equity expense.","severity":"watch","observed_at":"2026-10-02T10:52:00-07:00","source_urls":"[\"https://www.marketwatch.com/livecoverage/stock-market-today-dow-s-p-500-nasdaq-september-jobs-report/card/treasury-yields-head-up-again-shrugging-off-soft-jobs-report-Vbn9psqqGSwTs5Pf9xlG\",\"https://www.europesays.com/europe/151110/\"]","created_at":"2026-10-02T23:33:31.716Z"},{"fingerprint":"2026-10-02-france-germany-spread-158-67bp","title":"France-Germany 10y spread 158.67bp — widest since November 2011","summary":"Spread between French and German 10y yields hit 158.67bp, widest since Nov 2011. Thursday's 43B-euro austerity budget failed to restore confidence; French 10y OAT hit 4.96%, highest since July 2002. European bank stocks had their worst week in five months (~-6%).","why_important":"Citi puts fair value for the spread at only 50bp — the remaining ~110bp is a political/fiscal premium. Markets now pricing possible ECB intervention (TPI). ING: ECB 'must be worried about contagion into Italy and Spain.'","broader_economy":"Eurozone sovereign stress raises bank funding costs and tightens euro-area financial conditions without any ECB move; contagion risk to Italy/Belgium/Greece spreads.","mechanism":"France fiscal stress -> term premium up -> bank sovereign holdings weaken -> banks tighten lending/funding costs rise -> euro-area financial conditions tighten. Simultaneously, hot eurozone CPI reprices global rates upward, feeding back into US long-end yields.","timing_read":"Counter-narrative: if ECB deploys TPI or caps fragmentation, French spreads compress fast and ease global long-end pressure — buying the extension case time. Trigger to watch is ECB communication, not the French budget.","severity":"watch","observed_at":"2026-10-02T10:52:00-07:00","source_urls":"[\"https://www.wsj.com/finance/u-s-treasury-yields-steady-as-buyers-resurface-4c139277\",\"https://www.morningstar.com/news/dow-jones/202610022076/swiss-franc-rises-as-dollar-eases-and-french-german-yield-spreads-widen-sharply\"]","created_at":"2026-10-02T23:33:31.716Z"},{"fingerprint":"2026-10-02-nasdaq-alltime-high","title":"Nasdaq Composite hit new all-time high; NVDA on track for record close","summary":"Nasdaq rose ~1.2-1.4% Friday, trading above its Sept 22 record close of 27,244.28 (23rd record of 2026). Nvidia on track for its first record close since May, reclaiming its $235.74 high.","why_important":"The +29K payroll print flipped hike odds and pushed the 10y briefly to 5.16% — the soft-data/no-hike combination the extension case needs. NVDA reclaiming its May high after the Morgan Stanley Top-Pick reinstatement is AI leadership reasserting itself.","broader_economy":"Equities pricing rate-path relief while bonds are pricing fiscal/inflation reality — the divergence that, when it reconciles, reconciles at equity expense.","mechanism":"Lower hike odds -> lower discount rates -> growth stocks bid; but the rally happened on narrowing breadth (tech sector funds saw outflows the same week).","timing_read":"Extension path playing out intraday. But note divergence: tech-sector funds saw $3.79B outflows even as large caps took $19.3B — the multiple-expansion bid is thinner than the index level suggests.","severity":"watch","observed_at":"2026-10-02T10:22:00-07:00","source_urls":"[\"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10022026-12153808\",\"https://www.marketwatch.com/livecoverage/stock-market-today-dow-s-p-500-nasdaq-september-jobs-report/card/nasdaq-heads-for-fresh-record-close-jmWjode4iXnedR3IJcsA\",\"https://www.barrons.com/livecoverage/stock-market-news-today-100226/card/nasdaq-and-nvidia-are-back-to-record-levels-PqPL65mkthyHjKc5bq8i\"]","created_at":"2026-10-02T23:33:31.714Z"},{"fingerprint":"2026-10-02-hpe-vultr-1-2b-order","title":"HPE +7.8%, top S&P gainer: $1.2B Vultr AI order, raised networking guidance","summary":"HPE jumped 7.8% as carryover from Wednesday's networking investor day (raised FY27 networking revenue growth to high-teens/low-20s from 14-17%) plus a $1.2B Vultr order for AMD Helios AI racks with Juniper switches (first Helios order). Citi raised target to $92 from $76.","why_important":"HPE being re-rated from server/storage vendor to AI networking play; networking CAGR reset to high-teens through FY29. Vultr deal confirms AMD Helios is winning real rack orders beyond Nvidia's stack.","broader_economy":"AI capex flowing to the networking layer — physical buildout thesis in microcosm; Juniper acquisition synergies playing out in margins.","mechanism":"Cloud/datacenter switching demand -> networking segment growth -> margin mix uplift -> multiple re-rating.","timing_read":"Extension data point (AI demand durability). Feeds the 'spending piece' of ING's AI yield attribution on the other side.","severity":"context","observed_at":"2026-10-02T10:22:00-07:00","source_urls":"[\"https://www.reuters.com/business/hpe-boosts-networking-growth-outlook-gets-12-billion-ai-order-cloud-firm-vultr-2026-09-30/\",\"https://business.theeveningleader.com/theeveningleader/article/stockstory-2026-10-2-why-hewlett-packard-enterprise-hpe-stock-is-up-today\"]","created_at":"2026-10-02T23:33:31.715Z"},{"fingerprint":"2026-10-02-equity-flows-20-6b-tech-outflows","title":"US equity funds +$20.6B second weekly inflow; tech sector funds -$3.79B","summary":"LSEG Lipper: US equity funds took in $20.6B for a second straight week (prior week $37.5B). Large caps got $19.3B — their second-largest weekly inflow of the quarter. But tech sector funds saw $3.79B outflows after a three-week buying streak. Bond funds +$6.45B, money market funds -$41.4B.","why_important":"Headline says risk-on; the composition says rotation, not conviction: money is buying broad large-cap index exposure while trimming concentrated tech funds into record highs. Same Reuters piece adds Goldman Sachs: hyperscaler capex on track for ~$800B in 2026, $1.1T in 2027.","broader_economy":"Retail/institutional appetite still strong, but AI trade concentration is being managed down — a thinner foundation for further multiple expansion.","mechanism":"Fund flows -> index-level demand vs sector-level rotation; outflows from tech funds into broad large-cap signals dip-buying the market, not the AI trade specifically.","timing_read":"Divergence flag inside the extension case. If even tech-fund holders trim into record highs, the multiple-expansion bid is fragile.","severity":"watch","observed_at":"2026-10-02T10:22:00-07:00","source_urls":"[\"https://www.reuters.com/business/us-equity-funds-post-second-weekly-inflow-ai-optimism-tempers-yield-concerns-2026-10-02/\"]","created_at":"2026-10-02T23:33:31.715Z"},{"fingerprint":"2026-10-02-ing-ai-20pct-yield-rise","title":"ING: ~20% of Q3's long-end yield rise attributable to AI","summary":"ING research (Barron's coverage): ~20% of the Q3 rise in longer-dated rates attributable to AI through three channels — spending (~5%), capital-markets issuance (~25%), productivity (~70%, most theoretical). Dot-com had 10y real yields at 4% and nominal >6%; today 2.9% real / ~5.2% nominal — 'at least 100bp below' 2000 levels. ING also says inflation and fiscal deficits were the bigger overall drivers.","why_important":"Cleanest quantification yet of the central loop: AI is both the thing equities price up and the thing bonds price against. If ~20% of a ~70bp quarterly move came from AI channels, the AI-credit machine is measurably steepening the curve that discounts AI equities.","broader_economy":"The issuance leg: every SoftBank/Broadcom/hyperscaler bond sale adds duration supply competing with Treasuries. Minneapolis Fed calls AI capex 'a strong force raising real interest rates' — financing of the boom and discounting of the boom pull in opposite directions by construction.","mechanism":"AI capex -> real investment demand absorbs capital + AI bond issuance floods duration supply (term premium rises) + productivity narrative lifts expected returns on capital -> real yields rise -> tech multiples compress even as AI stocks rally.","timing_read":"Base case unchanged, 2/12 flashing. But dot-com anchor: ING's math says ~100bp below 2000 yield levels on the 'productivity is real' path — compression window could extend upward before the break.","severity":"watch","observed_at":"2026-10-02T09:25:00-07:00","source_urls":"[\"https://www.barrons.com/articles/ai-bond-yield-treasuries-stock-market-7e0e6d45\",\"https://think.ing.com/articles/to-what-extent-is-the-rise-in-long-dated-rates-attributable-to-ai/\"]","created_at":"2026-10-02T23:33:31.719Z"},{"fingerprint":"2026-10-04-amazon-built-together-100-moratoriums","title":"Amazon Built Together: $1B pledge to data-center towns as 100+ moratoriums loom","summary":"AWS CEO Matt Garman announced (Fri Oct 2) a $1B-over-5-years Built Together program for communities hosting Amazon data centers (free community college, job training, energy/water upgrades) plus a codified Data Center Commitment: no NDAs with governments, annual energy/water reporting, pay enough for power to keep local bills from rising. Garman said 100+ data-center moratoriums are being considered nationwide and warned that if enacted, the US could be writing its own losing ticket in the AI race. The pledge is ~2% of one quarter of Amazon capex (2026 guidance ~$220B).","why_important":"The largest hyperscaler just quantified a physical constraint on the AI buildout: community opposition. Moratoriums are a binary risk to the $220B capex program — capex can be funded but not built.","broader_economy":"Data centers are the single largest driver of US construction and industrial power demand. Moratorium delays would ripple through electrical equipment, construction labor, and the utility capex cycle.","mechanism":"Siting delays push AI revenue further out while debt-funded capex is already on the books; project returns thin, credit terms tighten, and tech multiples compress against the same $220B spend with less to show for it.","timing_read":"Adds a physical/siting constraint leg to the base case (orderly compression, 45%, begins within 4-8 weeks). Watch local moratorium votes as binary risk events to hyperscaler growth plans.","severity":"watch","observed_at":"2026-10-02T09:00:00-07:00","source_urls":"[\"https://www.geekwire.com/2026/amazon-pledges-1b-to-data-center-communities-warns-that-local-opposition-threatens-u-s-ai-lead/\"]","created_at":"2026-10-04T11:34:42.709Z"},{"fingerprint":"2026-10-02-cook-ai-inflation-2027-risk","title":"Fed Gov Cook: AI buildout inflation risk a top 2027 concern","summary":"Lisa Cook said AI's physical buildout could create persistent inflation pressure and is a top 2027 concern (chip/software price surge, electricity/water ~+5% on data-center demand); she still expects longer-run productivity benefits. She did not explicitly advocate another hike.","why_important":"A Fed governor explicitly naming AI buildout as an inflation risk validates the supply-side channel of the tightening thesis — and pushes back on the 'AI is disinflationary' counter-narrative.","broader_economy":"If the AI buildout raises electricity, chip, and construction costs persistently, it feeds into core services inflation just as the Fed tries to finish the last mile.","mechanism":"Data-center demand -> electricity/water/compute price pressure -> persistent services inflation -> Fed keeps policy restrictive -> higher for longer.","timing_read":"Supports the compression thesis structurally; no immediate signal change.","severity":"context","observed_at":"2026-10-02T08:45:00-07:00","source_urls":"[\"https://www.reuters.com/business/feds-cook-sees-ai-inflationary-push-top-2027-risk-2026-10-01/\",\"https://www.barrons.com/articles/fed-lisa-cook-ai-buildout-inflation-2027-71bb3a0f\"]","created_at":"2026-10-02T23:33:31.719Z"},{"fingerprint":"2026-10-02-nvidia-burry-depreciation-debate","title":"Nvidia defends longer server useful lives; Burry disputes residual values","summary":"Nvidia publicly defended longer server useful lives; Meta and Google now assume ~6 years, while Michael Burry argues Nvidia's residual-value case relies on modeled rental cash flows rather than actual resale values.","why_important":"Depreciation assumptions are the accounting hinge of the AI capex boom: longer lives -> lower depreciation -> higher reported earnings and easier financing. If Burry is right, the earnings quality of the hyperscaler capex cycle is overstated.","broader_economy":"Accounting-driven earnings support feeds the multiple; a depreciation reckoning would hit both earnings and the residual-value collateral behind AI financing.","mechanism":"Useful-life assumptions -> depreciation expense -> reported earnings -> equity multiples; residual-value models -> collateral for AI credit -> credit availability.","timing_read":"Key fault line to watch for the compression thesis; no signal change yet.","severity":"context","observed_at":"2026-10-02T08:45:00-07:00","source_urls":"[\"https://www.barrons.com/articles/nvidia-stock-price-chips-michael-burry-9c38deb9\"]","created_at":"2026-10-02T23:33:31.723Z"},{"fingerprint":"2026-10-02-nfp-sept-29k-miss","title":"September payrolls miss: +29K vs ~84K expected; unemployment 4.2%","summary":"Nonfarm payrolls added just 29,000 jobs in September vs ~84,000 expected (WSJ consensus); August revised down to 133,000 from 162,000. Unemployment rose to 4.2% vs 4.1% expected.","why_important":"Weak headline cooled fears of an overheating economy, pushing October hike odds down sharply (64% to ~21%) and sparking a 1%+ equity rally. Soft but not collapsing — a 'not too hot, not too cold' print markets liked.","broader_economy":"Labor market is 'simmering, not boiling': goods-producing sectors tied to AI boom still expanding while services feel strain. Supports Fed patience, but doesn't signal broad layoffs (initial claims still near 57-year lows).","mechanism":"Softer labor data -> lower near-term inflation risk perception -> traders cut hike odds -> front-end yields fall and equities bid. The transmission runs through Fed expectations, not actual rate action.","timing_read":"Dovish at the margin; extension case helped. But later-day reversal showed bonds repriced on inflation, not the Fed path.","severity":"watch","observed_at":"2026-10-02T08:30:00-07:00","source_urls":"[\"https://www.wsj.com/economy/jobs/september-jobs-report-unemployment-6b6d6643\",\"https://www.marketwatch.com/livecoverage/september-jobs-report-today-live-updates\"]","created_at":"2026-10-02T23:33:31.713Z"},{"fingerprint":"2026-10-02-g7-100m-barrel-release","title":"G7 coordinated 100M-barrel emergency oil/diesel release","summary":"G7 agreed to release 100M barrels of crude and diesel through the IEA over four months, with a frontloaded diesel release within 20 days and a pledge to avoid energy export restrictions — ending the US diesel-export-ban threat.","why_important":"Removes the near-term tail risk of a US diesel export ban, which would have spiked global refined-product prices. Frontloaded diesel release targets the actual pinch point.","broader_economy":"Energy cost relief for transportation/agriculture over the next 20-80 days, but reserves are a finite tool and this is the second mega-release this year.","mechanism":"Strategic reserve release -> physical supply increase -> spot/near-dated prices fall -> CPI energy component cools -> reduces hawkish repricing pressure on the long end.","timing_read":"Removes a near-term disorderly trigger tail; supports the base case (no discrete trigger) rather than changing it.","severity":"context","observed_at":"2026-10-02T08:25:00-07:00","source_urls":"[\"https://www.reuters.com/business/energy/g7-release-100-million-barrels-diesel-other-reserves-through-iea-2026-10-02/\",\"https://topologypro.one/g7-to-release-100m-barrels-from-reserves-to-combat-surging-diesel-prices-europe-live-637202.html\"]","created_at":"2026-10-02T23:33:31.719Z"},{"fingerprint":"2026-10-02-nvidia-b300-china-state-lessor","title":"Chinese state-backed lessor financed 700+ servers, incl. restricted Nvidia B300s","summary":"Bloomberg-based reporting found Semi-Tech Leasing Group, controlled by Chinese municipal entities, financed 700+ servers for Glory View; one contract identified 32 Asustek servers with restricted Nvidia B300 chips. Caveat: filings establish financing, not confirmed delivery of every server or a legal finding.","why_important":"Export-control evasion through leasing structures keeps advanced compute flowing to China — demand-side support for Nvidia, but geopolitical risk for the semiconductor trade framework.","broader_economy":"If enforced, export controls tighten; if porous, AI chip demand stays elevated globally.","mechanism":"Leasing structures -> sanctions evasion -> sustained Nvidia demand -> supports AI capex durability narrative; crackdown risk -> supply-chain disruption.","timing_read":"Extension-side datapoint for AI demand; counter-narrative is enforcement action.","severity":"context","observed_at":"2026-10-02T08:25:00-07:00","source_urls":"[\"https://aiweekly.co/alerts/chinese-state-lessor-funded-700-servers-32-with-nvidia-b300s\",\"https://runtimewire.com/article/china-state-backed-lessor-nvidia-b300-servers\"]","created_at":"2026-10-02T23:33:31.720Z"},{"fingerprint":"2026-10-02-hang-seng-2-6pct-drop","title":"Hang Seng -2.6%: worst day since March, lowest close since July","summary":"Hang Seng fell 2.6%, worst day since March and lowest close since July; down four consecutive weeks, roughly 6.5% over four weeks. Alibaba ADRs -1.5% premarket; JD.com and Baidu ~-1%.","why_important":"China tech duration shock: US yields pulling global risk assets down; Hang Seng duration-sensitive.","broader_economy":"Global transmission of US rate repricing into EM/China equities.","mechanism":"US 10y higher -> global discount rates higher -> China tech multiples compress -> capital flows.","timing_read":"Compression thesis playing out in the most duration-sensitive equity market first.","severity":"context","observed_at":"2026-10-02T08:05:00-07:00","source_urls":"[\"https://www.barrons.com/articles/alibaba-stock-price-treasury-yields-25ae7224\",\"https://www.morningstar.com/news/dow-jones/202610022168/hang-seng-index-falls-219-this-week-to-2397229-data-talk\"]","created_at":"2026-10-02T23:33:31.722Z"},{"fingerprint":"2026-10-02-ms-nvda-top-pick","title":"Morgan Stanley reinstates Nvidia as semiconductor Top Pick","summary":"Morgan Stanley reinstated Nvidia as its semiconductor Top Pick after meetings with Jensen Huang and Colette Kress. Overweight rating and $300 target maintained; an analyst call, not a company event.","why_important":"Sell-side re-endorsement of the AI trade leader; NVDA on track for first record close since May.","broader_economy":"Reinforces AI capex durability narrative across semis, cloud, and power-equipment supply chains.","mechanism":"Top-pick call -> institutional re-risk into NVDA -> index leadership -> breadth concentration.","timing_read":"Extension datapoint; watch NVDA IV (31.5% vs 55-60% trigger) for complacency.","severity":"context","observed_at":"2026-10-02T07:27:00-07:00","source_urls":"[\"https://www.investors.com/news/technology/nvidia-stock-regains-top-pick-status-at-morgan-stanley/\",\"https://stocktwits.com/news-articles/markets/equity/nvda-stock-is-back-as-morgan-stanley-s-top-pick-all-ai-trends-play-to-nvidia-s-strengths-says-analys/cZDjOo1RBK7\"]","created_at":"2026-10-02T23:33:31.723Z"},{"fingerprint":"2026-10-02-tesla-q3-deliveries-beat","title":"Tesla Q3 deliveries 486,532 beat consensus (~457-462K)","summary":"Tesla delivered 486,532 vehicles in Q3 2026, beating consensus of roughly 456,896-461,974. Up 1% QoQ, down 2% YoY; European recovery offset US/China weakness. Energy storage deployments 13.7 GWh, below the 15.9 GWh company-compiled expectation.","why_important":"Delivery beat suggests EV demand is stabilizing after tariff/macro headwinds; shares rallied ~4.5% Friday. European recovery is the surprise — offsetting China softness.","broader_economy":"Consumer durables resilience despite high rates and weak sentiment readings; supports the thesis that the 'rolling shock' to household spending hasn't broken goods demand.","mechanism":"Beat -> sentiment re-rating -> equity bid; but energy-storage miss shows AI-grid bottlenecks biting Tesla's own segment.","timing_read":"Extension-side data point; not directly connected to the credit-tightening thesis.","severity":"context","observed_at":"2026-10-02T06:35:00-07:00","source_urls":"[\"https://www.reuters.com/business/autos-transportation/tesla-posts-stronger-than-expected-quarterly-deliveries-2026-10-02/\",\"https://www.barrons.com/articles/tesla-delivery-results-d05dff64\",\"https://ir.tesla.com/press-release/delivery-consensus-third-quarter-2026\"]","created_at":"2026-10-02T23:33:31.714Z"},{"fingerprint":"2026-10-02-broadcom-60b-ai-financing","title":"Broadcom syndicate moved toward active syndication of ~$60B AI package","summary":"Broadcom's syndicate reportedly moved toward active syndication of a roughly $60B package: $42B senior secured plus $18B subordinated led by Blackstone. Correction: the $42B is inside the same package, not a separate additional commitment; the package was discussed in August and active syndication was the new reported step. Broadcom has not officially confirmed.","why_important":"$60B of AI-chip debt in one syndication is the issuance leg of the thesis at scale — more duration supply competing with Treasuries, more leverage into the AI buildout.","broader_economy":"AI credit chain getting deeper: hyperscaler bonds, chip-vendor financing, SPVs — each layer adds supply and leverage.","mechanism":"Mega-issuance -> duration supply -> term premium pressure -> long-end yields higher; also stress-tests order-book coverage (the <1.5x signal threshold).","timing_read":"Feeds the 'issuance piece' of ING's AI yield attribution. Watch hyperscaler bond order books for the next print.","severity":"watch","observed_at":"2026-10-02T05:16:00-07:00","source_urls":"[\"https://tradersunion.com/news/companies/show/3621205-broadcom-taps-debt-markets/\"]","created_at":"2026-10-02T23:33:31.720Z"},{"fingerprint":"2026-10-02-samsung-hbm4-4usd-gbit","title":"Samsung HBM4 negotiating quote mid-to-high $4/Gbit, 3x HBM3E","summary":"Reported negotiating quote: mid-to-high $4/Gbit for HBM4, over 3x HBM3E's ~$1.50/Gbit. This is a negotiating quote, not a closed-contract price.","why_important":"Memory pricing power at 3x signals extreme tightness in the AI memory stack — cost pressure on the entire GPU pipeline.","broader_economy":"DRAM/HBM is the bottleneck layer; pricing feeds directly into AI hardware capex costs.","mechanism":"HBM tightness -> GPU cost inflation -> higher AI capex requirements -> more financing -> more issuance.","timing_read":"Extension (demand strong), but feeds the spending/issuance channels that push yields up.","severity":"context","observed_at":"2026-10-02T04:35:00-07:00","source_urls":"[\"https://wccftech.com/samsung-hbm4-pricing-3x-hbm3e-dram-market/\",\"https://www.trendforce.com/news/2026/09/01/news-hbm3e-spot-prices-said-to-be-4-5x-lta-levels-with-samsung-reportedly-locking-70-of-memory-capacity-through-2031/\"]","created_at":"2026-10-02T23:33:31.721Z"},{"fingerprint":"2026-10-02-softbank-openai-10b-tranche","title":"SoftBank executed final $10B OpenAI tranche: $64.6B total for ~13%","summary":"SoftBank executed the final $10B tranche of its $30B OpenAI follow-on on Oct 1 Japan time. Cumulative investment: $64.6B for approximately 13%. Final tranche funded from September senior-note issuance; $40B bridge repaid, remaining $10B undrawn capacity canceled.","why_important":"One of the largest single-company AI financing chains completed — funded partly by SoftBank's own debt issuance. Concentrated exposure: $64.6B riding on one private company.","broader_economy":"AI funding chain leverage: senior notes -> bridge -> equity. If OpenAI's valuation cracks, the impairment cascades through SoftBank's balance sheet.","mechanism":"Debt-funded equity investment -> valuation risk concentrated -> impairment channel to SoftBank credit.","timing_read":"Extension narrative (funding secured) meets compression narrative (leverage).","severity":"watch","observed_at":"2026-10-02T03:25:00-07:00","source_urls":"[\"https://www.reuters.com/legal/transactional/softbank-completes-final-phase-30-billion-investment-openai-2026-10-01/\",\"https://group.softbank/en/news/press/20261001\"]","created_at":"2026-10-02T23:33:31.720Z"},{"fingerprint":"2026-10-02-amazon-gpu-price-hike-8b-spv","title":"AWS +15% EC2 Capacity Block price hikes; $8B Nvidia-chip sale-leaseback SPV","summary":"AWS announced ~15% EC2 Capacity Block rental-price increases beginning the following week, covering Nvidia A100 through B300 capacity. Paired with the reported $8B Nvidia-chip sale-leaseback SPV moving processors off the balance sheet.","why_important":"Pricing power confirms compute scarcity (bullish for AI demand), but the SPV is balance-sheet engineering — moving capex off-books to sustain spending. The rental hike vs. Burry's depreciation critique is the key tension.","broader_economy":"Compute pricing is now a macro variable: +15% on capacity blocks feeds into AI services cost structure.","mechanism":"Scarcity pricing -> AWS margins, but also -> customer cost pressure; SPV -> off-balance-sheet leverage -> less visible credit risk.","timing_read":"Extension (demand strong) and compression (leverage growing) sides of the same trade.","severity":"watch","observed_at":"2026-10-02T03:05:00-07:00","source_urls":"[\"https://www.marketwatch.com/story/amazon-is-hiking-chip-rental-prices-and-reportedly-moving-nvidia-processors-off-the-balance-sheet-b205a0b0\",\"https://wixx.com/2026/10/01/amazon-seeks-to-offload-8-billion-of-nvidia-chips-to-investors-ft-reports/\"]","created_at":"2026-10-02T23:33:31.720Z"},{"fingerprint":"2026-10-02-meta-newmexico-35-40b-penalty","title":"New Mexico seeks $35-40B penalty from Meta after privacy trial","summary":"New Mexico requested $35B-40B in penalties (not a judgment); Sept 25 jury found 43M+ consumer-law violations; judge decides penalty later in October. Meta seeks a $3.45B cap.","why_important":"Largest-ever state privacy ask; even a fraction would dent Meta's buyback capacity — and Meta is one of the AI-rally's leaders (+20% recently, partly on buybacks).","broader_economy":"Regulatory overhang on Big Tech cash return machinery.","mechanism":"Penalty -> reduced buyback authorization -> equity support weakens -> multiple compression for a key AI leader.","timing_read":"Context; October decision is the catalyst date.","severity":"context","observed_at":"2026-10-02T02:36:00-07:00","source_urls":"[\"https://www.tbsnews.net/world/new-mexico-wants-meta-pay-40-billion-penalties-after-data-privacy-trial-1560216\"]","created_at":"2026-10-02T23:33:31.721Z"},{"fingerprint":"2026-10-04-carlyle-private-credit-ai-concentration","title":"Carlyle: private credit AI push risks concentration failure","summary":"Carlyle white paper (Oct 1) warns private-credit firms financing the AI buildout risk the same concentration problems that plagued software lenders; failing to limit AI-compute concentration could be the biggest mistake of all. The industry may need ~$1T to finance AI compute infrastructure, over half of private credit AUM. Separately, Carlyle research chief Jason Thomas told Bloomberg TV that data-center project financing echoes 2005-2007 mortgages: lenders lean on the investment-grade sponsors credit rather than underwriting the project itself. Carlyle itself was in the syndicate behind CoreWeaves $7.5B private loan package.","why_important":"One of the largest private-credit lenders just flagged the exact failure mechanism the collapse framework centers on: AI lending concentrated in a handful of names, underwritten on sponsor credit rather than project cash flows.","broader_economy":"Private credit is now a multitrillion-dollar shadow-banking system funding what banks used to fund. A concentration event in AI lending would transmit into credit spreads, BDC marks, and institutional portfolios fast.","mechanism":"Concentrated AI-compute lending with sponsor-credit underwriting means a pause in AI capex hits the same collateral (depreciating GPUs) across many lenders at once; mark-downs and covenant breaches widen HY OAS and force tighter terms on the next round of AI funding.","timing_read":"Supports the base-case mechanism where AI credit is the bubble leg. A large AI-credit default is one of the four disorderly triggers (30% scenario). Next checkpoint: Proskauer Q3 default-rate print expected late October 2026.","severity":"watch","observed_at":"2026-10-01T12:00:00-07:00","source_urls":"[\"https://news.bloomberglaw.com/crypto/carlyle-warns-private-credit-ai-push-runs-concentration-risk-1\"]","created_at":"2026-10-04T11:34:47.949Z"},{"fingerprint":"2026-10-01-goldman-fed-hike-forecast-december","title":"Goldman pushes next Fed hike forecast to December; October-hike odds collapse to 38%","summary":"Goldman Sachs pushed its forecast for the next 25bp Fed rate hike from October to December after August PCE printed 3.4% y/y vs 3.7% expected; the note adds a strong chance the FOMC ultimately concludes no more hikes are needed. October-hike odds fell from ~71% a week ago to 38% (CME FedWatch), helped by dovish comments from NY Fed President Williams. The Fed hiked in September — its first move in three years and the first under new chair Kevin Warsh.","why_important":"In a regime where the 10y is hovering near 5.2–5.3% on hike fears, the October hike coming off the table is the single biggest near-term bond-market repricing — it directly sets the discount rate compressing (or no longer compressing) tech multiples.","broader_economy":"Fewer hikes = looser financial conditions than feared; supports capex and hiring plans that were being repriced under the Warsh-hiking regime, but also risks re-igniting the inflation the September hike was meant to fight.","mechanism":"Softer PCE → lower expected policy path → lower term premium in long bonds → lower discount rates → relief for duration-sensitive growth/tech multiples and corporate borrowing costs; the transmission is expectations-driven and can reverse on the next hot print.","timing_read":"Timing read (base case 45% orderly tech-multiple compression beginning within 4–8 weeks, Nov 2026–Mar 2027; Nasdaq-100 fwd P/E 26.5x → 21–23x, -15 to -25%): dovish repricing trims the near-term disorderly-break tail (10y toward 5.5% sustained) and leans extension-ward, but base case intact — 10y still above 5.2% and HY OAS still ~311bp.","severity":"watch","observed_at":"2026-10-01T05:00:00-07:00","source_urls":"[\"https://www.reuters.com/business/goldman-sachs-pushes-fed-rate-hike-forecast-december-2026-10-01/\"]","created_at":"2026-10-04T08:54:40.290Z"},{"fingerprint":"2026-09-29-openai-30b-raise-1-4t-valuation","title":"OpenAI in talks for $30B+ bridge round at $1.4T pre-money after ruling out 2026 IPO","summary":"OpenAI is in early-stage, investor-demand-led talks to raise at least $30B at ~$1.4T pre-money (Bloomberg, people familiar), a bridge round after Sam Altman ruled out a 2026 IPO. It follows the March $122B round at $852B post-money co-led by Amazon, Nvidia and SoftBank; run-rate revenue reportedly $40–70B, up ~70% since July. A $1.4T pre-money figure is ~64% above the March valuation six months later.","why_important":"The single largest private AI financing datapoint in months — the core of the AI-credit-bubble thesis. $30B more bridge capital both extends the lab’s burn runway and deepens the circular vendor-financing stack (hyperscaler chips → lab equity → more chip demand) that credit markets ultimately have to underwrite.","broader_economy":"Continued mega-financing of frontier AI keeps data-center capex flowing — supporting semis, cloud, and power-equipment supply chains — while concentrating private-credit exposure in one unprofitable name at ever-higher valuations.","mechanism":"Bridge equity delays the funding cliff that could force a disorderly AI-credit event, but each round at a higher valuation raises the default/restructuring loss-given-default for the credit chain behind it; the transmission into markets runs through credit spreads (HY OAS, hyperscaler order books), not equity multiples first.","timing_read":"Timing read (base case 45% orderly tech-multiple compression beginning within 4–8 weeks, Nov 2026–Mar 2027; Nasdaq-100 fwd P/E 26.5x → 21–23x, -15 to -25%): this deepens the AI-credit leg of the base case — bridge capital pushes a disorderly credit-default trigger further out while enlarging eventual exposure. Disorderly break still needs a discrete trigger (Brent >$130, soft auction BTC<2.3x, USD/JPY 160, or a large AI-credit default).","severity":"watch","observed_at":"2026-09-29T05:00:00-07:00","source_urls":"[\"https://techcrunch.com/2026/09/29/openai-reportedly-in-talks-to-raise-30b-round-at-1-4t-valuation/\"]","created_at":"2026-10-04T08:54:54.536Z"}],"signals":[{"key":"hy-oas","name":"HY OAS","threshold":">350bp (disorderly >450bp)","direction":"higher=worse"},{"key":"ccc-bb","name":"CCC–BB differential","threshold":">1,000bp","direction":"higher=worse"},{"key":"hyperscaler-books","name":"Hyperscaler bond order books","threshold":"<1.5x coverage or pulled deal","direction":"higher=worse"},{"key":"private-credit-defaults","name":"Private-credit defaults","threshold":">4%","direction":"higher=worse"},{"key":"ust-10y","name":"10y Treasury","threshold":">5.5% sustained 2+ weeks (disorderly >6%)","direction":"higher=worse"},{"key":"tips-10y","name":"10y TIPS real yield","threshold":">2.75%","direction":"higher=worse"},{"key":"move","name":"MOVE index","threshold":">13 const fmtT = t => { try { return new Date(t).toLocaleString('en-US',{timeZone:'America/Los_Angeles',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); } catch(e){ return t; } };
const pillFor = st => st==='flashing'||st==='triggered' ? 'flashing' : st==='watch' ? 'watch' : st==='clear' ? 'clear' : 'unknown';
const pillLabel = st => st==='flashing' ? 'FLASHING' : st==='triggered' ? 'TRIGGERED' : st==='watch' ? 'WATCH' : st==='clear' ? 'BELOW' : 'NO DATA';

function SignalRow(p){
  const [open,setOpen] = React.useState(false);
  const s = p.s, L = DATA.latest[s.key]||{}, H = DATA.hist[s.key]||[];
  const st = L.status || 'unknown';
  return h('div',{className:'sig'},
    h('div',{className:'num'}, p.i),
    h('div',{className:'sbody'},
      h('div',{className:'shead'},
        h('span',{className:'kicker'}, (CHANNEL[s.key]||'') + ' channel'),
        h('span',{className:'pill '+pillFor(st)}, pillLabel(st))),
      h('div',{className:'stitle'}, s.name),
      L.reading ? h('div',{className:'sreading'}, L.reading) : null,
      L.observed_at ? h('div',{className:'sasof'}, 'as of ' + fmtT(L.observed_at)) : null,
      L.note ? h('p',{className:'snote'}, L.note) : null,
      h('button',{className:'toggle',onClick:()=>setOpen(!open)},
        'Threshold & evidence ', h('span',{className:'plus'}, open?'−':'+')),
      h('div',{className:'thresh'}, s.threshold),
      open && H.length ? h('ul',{className:'hist open'},
        H.map((r,j)=>h('li',{key:j}, h('span',null,fmtT(r.observed_at)+' · '+r.status), h('span',{className:'r'},r.reading)))) : null
    ));
}

function App(){
  const [tab,setTab] = React.useState('all');
  const [fpill,setFpill] = React.useState('all');
  const nF = FLASH.length;
  const sigs = DATA.signals.map((s,idx)=>({s,idx})).filter(({s})=>{
    if(tab!=='all' && CHANNEL[s.key]!==tab) return false;
    const st=(DATA.latest[s.key]||{}).status||'unknown';
    if(fpill==='attention' && !(st==='flashing'||st==='triggered'||st==='watch')) return false;
    if(fpill==='below' && st!=='clear') return false;
    return true;
  });
  const seg = [
    {n:2, c:'var(--red)'}, {n:6, c:'var(--amber)'},
    {n:3, c:'var(--green)'}, {n:1, c:'var(--gray)'}
  ];
  return h('div',{className:'wrap'},
    h('div',{className:'masthead'},
      h('div',{className:'kicker'},'AI Crash Watch'),
      h('div',{className:'pagetitle'},'Market Digest')),
    h('div',{className:'rule'}),
    h('div',{className:'fedrow'},
      h('span',{className:'dot'}),
      h('span',null,'Monitor-fed · Last observation ' + fmtT(ASOF)),
      h('span',{className:'sp'}),
      h('a',{href:'#',onClick:e=>{e.preventDefault();location.reload();}},'⟳ Refresh')),
    h('section',null,
      h('div',{className:'kicker'},'Current regime'),
      h('h1',{className:'hero'}, h('span',{className:'red'}, String(nF)), ' of 12 warnings flashing'),
      h('p',{className:'lede'}, nF>=3
        ? 'Three or more warnings are flashing. The compression window is no longer hypothetical — price action is confirming the credit channel.'
        : 'The valuation anchor is breached. Credit and rate channels are tightening, but no disorderly trigger is confirmed.'),
      h('div',{className:'modal'},
        h('div',{className:'kicker'},'Modal clock'),
        h('div',{className:'when'},'Late Oct ’26 → Feb ’27'),
        h('p',null,'Begins within 4–8 weeks; plays out over 3–6 months (Nov 2026–Mar 2027)')),
      h('div',{className:'segbar'}, seg.map((s,i)=> s.n? h('div',{key:i,style:{width:(s.n/12*100)+'%',background:s.c}}) : null)),
      h('div',{className:'legend'},
        h('span',null,h('i',{style:{background:'var(--red)'}}), ' '+2+' flashing'),
        h('span',null,h('i',{style:{background:'var(--amber)'}}), ' '+6+' watch'),
        h('span',null,h('i',{style:{background:'var(--green)'}}), ' '+3+' below'),
        h('span',null,h('i',{style:{background:'var(--gray)'}}), ' '+1+' open'))),
    h('section',null,
      h('div',{className:'kicker'},'Threshold board'),
      h('h2',{className:'sec'},'Twelve early warnings'),
      h('p',{className:'sub'},'Ranked from longest lead to coincident confirmation.'),
      h('div',{className:'tabs'},
        ['all','credit','rates','market'].map(t=>
          h('button',{key:t,className:tab===t?'on':'',onClick:()=>setTab(t)},
            t==='all'?'All':t[0].toUpperCase()+t.slice(1)))),
      h('div',{className:'pills'},
        h('button',{className:fpill==='all'?'on':'',onClick:()=>setFpill('all')},'Every status'),
        h('button',{className:fpill==='attention'?'on':'',onClick:()=>setFpill('attention')},'Needs attention'),
        h('button',{className:fpill==='below'?'on':'',onClick:()=>setFpill('below')},'Below threshold')),
      sigs.map(({s,idx})=>h(SignalRow,{key:s.key,s,i:String(idx+1).padStart(2,'0')}))),
    h('section',null,
      h('div',{className:'kicker'},'Scenario clock'),
      h('h2',{className:'sec'},'Three paths from here'),
      h('p',{className:'sub'},'Probabilities are research judgments, not model outputs.'),
      SCEN.map((c,i)=> h('div',{className:'scen',key:i},
        h('div',{className:'prow'},
          h('span',{className:'pct'}, c.p+'%'),
          h('span',{className:'sname'}, c.name),
          h('span',{className:'barrow'},
            h('span',{className:'bar'}, h('i',{style:{width:c.p+'%'}})),
            h('a',{className:'details',href:'#'},'Details'))),
        h('div',{className:'lede2'}, c.lede),
        h('div',{className:'frow'}, h('div',{className:'kicker'},'Multiple'), h('p',null,c.multiple)),
        h('div',{className:'frow'}, h('div',{className:'kicker'},'Price'), h('p',null,c.price)),
        h('div',{className:'frow'}, h('div',{className:'kicker'},'Path'), h('p',null,c.path)),
        h('div',{className:'kicker'},'Judgment · '+c.judge)))),
    h('section',null,
      h('div',{className:'kicker'},'Change log'),
      h('h2',{className:'sec'},'What moved the clock'),
      h('p',{className:'sub'},'Verified developments, newest first. Context stays separate from formal threshold breaches.'),
      DATA.developments.map(d=>
        h('div',{className:'titem',key:d.fingerprint},
          h('div',{className:'ttime'}, fmtT(d.observed_at)),
          h('div',{className:'trail'}),
          h('div',{className:'tbody'},
            h('div',{className:'thead'},
              h('div',{className:'ttitle'}, d.title),
              h('span',{className:'pill '+d.severity}, d.severity.toUpperCase())),
            h('p',{className:'sum'}, d.summary),
            d.why_important ? h('div',{className:'blk'},h('div',{className:'kicker'},'Why it matters'),h('p',null,d.why_important)) : null,
            d.broader_economy ? h('div',{className:'blk'},h('div',{className:'kicker'},'Broader economy'),h('p',null,d.broader_economy)) : null,
            d.mechanism ? h('div',{className:'blk'},h('div',{className:'kicker'},'Mechanism'),h('p',null,d.mechanism)) : null,
            d.timing_read ? h('div',{className:'callout'}, d.timing_read) : null,
            (d.source_urls?JSON.parse(d.source_urls):[]).length
              ? h('div',{className:'srcs'}, (d.source_urls?JSON.parse(d.source_urls):[]).map((u,i)=>
                  h('a',{key:i,href:u,target:'_blank',rel:'noreferrer'}, 'Source '+(i+1)+' ↗'))) : null
          )))),
    h('footer',null,'AI Crash Watch · every item verified against a primary or credible source before entering the database. Readings carry explicit as-of timestamps; nothing is guessed. Data as of ' + fmtT(ASOF) + '.')
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
